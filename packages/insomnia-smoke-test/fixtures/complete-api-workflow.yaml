  - _id: unit_test_suite
    parentId: wrk_complete_api_workflow
    modified: 1640995200000
    created: 1640995200000
    name: API Tests
    _type: unit_test_suite
    requests:
      - requestId: req_get_all_users
        name: Test GET User
        code: |
          // Test response status
          insomnia.test('Status code is 200', () => {
            insomnia.expect(insomnia.response.code).to.equal(200);
          });
          
          // Test response structure
          insomnia.test('Response is an object with user data', () => {
            const body = insomnia.response.json();
            insomnia.expect(body).to.be.an('object');
            insomnia.expect(body).to.have.property('id');
            insomnia.expect(body).to.have.property('name');
            insomnia.expect(body).to.have.property('email');
          });
          
          // Test response time
          insomnia.test('Response time is under 500ms', () => {
            insomnia.expect(insomnia.response.responseTime).to.be.below(500);
          });
      
      - requestId: req_create_user
        name: Test Create User
        code: |
          // Test response status
          insomnia.test('Status code is 200', () => {
            insomnia.expect(insomnia.response.code).to.equal(200);
          });
          
          // Test response body structure
          insomnia.test('Response contains object data', () => {
            const body = insomnia.response.json();
            insomnia.expect(typeof body).to.equal('object');
          });